[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-language-to-text"
version = "0.1.0a0"
description = "Real-time static sign language to text conversion using MediaPipe hand landmarks and classical machine learning"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
keywords = ["sign-language", "computer-vision", "mediapipe", "machine-learning", "accessibility"]

# Runtime dependencies are declared in requirements.txt (with detailed rationale
# comments that PEP 621 metadata cannot carry). This section stays deliberately
# minimal to avoid two competing sources of truth.
# See docs/RULES.md §Dependency-Rules.

[tool.setuptools.packages.find]
where = ["src"]

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: fast, isolated, no camera and no model required",
    "integration: exercises multiple modules wired together",
    "model: requires a trained model in models/ — skipped when absent",
    "camera: requires a physical webcam — skipped in CI",
    "slow: takes more than ~2 seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.protobuf.*",
    "ignore::UserWarning:mediapipe.*",
]

# ------------------------------------------------------------------------------
# coverage
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/sign_language"]
branch = true
omit = [
    "*/ui/desktop_app.py",   # GUI event loop, exercised by manual UI tests
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ------------------------------------------------------------------------------
# black
# ------------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]

# ------------------------------------------------------------------------------
# ruff  (replaces flake8 + isort)
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # prefer pathlib over os.path
    "RET",  # return statement consistency
    "ARG",  # unused arguments
    "D",    # pydocstyle — docstrings are mandatory, see docs/RULES.md
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E501",  # line length handled by black
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG"]        # docstrings not required in tests
"scripts/**" = ["D103"]          # thin CLI wrappers
"__init__.py" = ["F401", "D104"] # re-exports are intentional

[tool.ruff.lint.pydocstyle]
convention = "google"

# ------------------------------------------------------------------------------
# mypy
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/sign_language"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

# Third-party libraries without bundled type stubs.
[[tool.mypy.overrides]]
module = ["cv2.*", "mediapipe.*", "customtkinter.*", "seaborn.*", "joblib.*", "PIL.*"]
ignore_missing_imports = true
